requirements:
  - name: Modern web browser
    kind: software
    cost: free
    notes: The 2D builder and exports work in current Chrome, Edge, Firefox and
      Safari. The 3D view uses WebGPU where available and falls back to WebGL 2.
  - name: GitHub account
    kind: service
    cost: free
    notes: Only needed to submit a design to the community gallery by pull
      request. Building, exporting and share links need no account.
    applies_to:
