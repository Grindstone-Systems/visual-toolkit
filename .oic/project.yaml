  edition: Hosted web builder
  cost: free
  notes: The builder is a static site that runs entirely in your browser, with no
    account, server or time limit. Exported SVG, PNG, glTF and JSON files are
    yours to use. The source is Apache-2.0 and can be self-hosted. Gallery
    entries are CC0-1.0.
