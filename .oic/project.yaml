faq:
  - question: Is this a replacement for Symbol Factory or Perspective Symbols?
    answer: No. Visual Toolkit generates assets. Ignition keeps tags, bindings,
      alarming and its native components. Use Perspective Symbols where they fit,
      and Visual Toolkit for equipment and looks they don't cover.
  - question: Do I need an account or a server?
    answer: No. Everything runs in your browser. Share links carry the whole design
      in the URL fragment, which is never sent to the web server.
  - question: Can I use the 3D models elsewhere?
    answer: Yes. They are standard glTF 2.0 files that pass the Khronos validator
      and open in three.js, Babylon, PlayCanvas and Blender. Visual Toolkit
      metadata for states, levels and cutaways travels in the file's extras.
  - question: Has the Ignition workflow been tested?
    answer: Partly. On a fresh Ignition 8.3.9 gateway, SVG images, state sets
      swapped by a tag expression, the icon repository and a Drawing with a
      tag-bound fill all worked. The guide lists what failed and what is still
      untested, including 8.1 and the Designer's drag-and-drop import.
