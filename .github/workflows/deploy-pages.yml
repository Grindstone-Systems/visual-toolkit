# Publishes the builder to GitHub Pages ($0 for public repositories).
# Enable once: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy builder
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pages:
    uses: Grindstone-Systems/.github/.github/workflows/pages.yml@main
    with:
      test: pnpm test && pnpm gallery:check
      # build:pages = the app build + the <vt-symbol> scripts under lib/
      # (…/lib/vt-symbol.js, vt-symbol.iife.js, visual-toolkit.js, demo.html, frame.html).
      build: pnpm build:pages
