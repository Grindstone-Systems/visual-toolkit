<!doctype html>
<!--
  One <vt-symbol> filling the page, configured from the URL, for hosts that can
  show a URL but not run your script (for example an Ignition Perspective
  Inline Frame; unverified, see docs/EMBED.md).

    frame.html?generator=tank.process&params={"label":"TK-1"}&state=running&level=0.4
    frame.html?recipe=z0.…#state=fault&level=0.7

  Any attribute can be given in the query or the #hash (hash wins). Changing only
  the #hash does not reload the page, and state/level then update in place.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Toolkit symbol</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      /* Fit the whole symbol inside the frame, whatever its aspect ratio. */
      vt-symbol { width: 100%; height: 100%; }
      vt-symbol::part(frame), vt-symbol::part(svg) { width: 100%; height: 100%; }
    </style>
    <script type="module" src="../../dist-lib/vt-symbol.js"></script>
  </head>
  <body>
    <vt-symbol id="sym"></vt-symbol>
    <script type="module">
      const ATTRS = ["recipe", "generator", "params", "style", "theme", "paint", "animate", "state", "level"];
      const sym = document.getElementById("sym");
      function apply() {
        const q = new URLSearchParams(location.search);
        const h = new URLSearchParams(location.hash.slice(1));
        for (const a of ATTRS) {
          const v = h.get(a) ?? q.get(a);
          if (v === null) sym.removeAttribute(a);
          else if (sym.getAttribute(a) !== v) sym.setAttribute(a, v);
        }
        const bg = h.get("bg") ?? q.get("bg");
        document.body.style.background = bg && /^(#[0-9a-f]{3,8}|[a-z]+)$/i.test(bg) ? bg : "transparent";
      }
      addEventListener("hashchange", apply);
      apply();
    </script>
  </body>
</html>
