<!doctype html><html><head><meta charset="utf-8"><style>html,body,#r{margin:0;height:100%;background:#f3f1e9;font-family:"Inter Variable",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.spatial{position:absolute;inset:0}.spatial-canvas{position:absolute;inset:0}.spatial-badge{position:absolute;left:0;top:0}.spatial-meta{position:absolute;left:8px;bottom:8px;font:12px monospace}</style></head>
<body><div id="r"></div><script type="module">
import { createElement as h } from "react";
import { createRoot } from "react-dom/client";
import Spatial3D from "../src/Spatial3D.tsx";
import { getGenerator, spatialGlb, defaultParams } from "../../lib/index.ts";
const q = new URLSearchParams(location.search);
const gen = getGenerator(q.get("gen") || "pump.centrifugal");
const params = { ...defaultParams(gen.params), ...JSON.parse(q.get("p") || "{}") };
const style = q.get("style") || "modern-flat", theme = q.get("theme") || "light", state = q.get("state") || "running";
document.body.style.background = theme === "dark" ? "#121518" : "#f3f1e9";
const glb = spatialGlb(gen.generate(params), gen.spatial(params), { style, theme, state: "normal", paint: q.get("paint") || "slate" });
createRoot(document.getElementById("r")).render(h(Spatial3D, { glb, state, theme, motion: q.get("motion") === "1", defaultEnv: q.get("env") || "studio", defaultCutaway: q.get("cut") === "1", defaultExploded: q.get("explode") === "1" }));
</script></body></html>
