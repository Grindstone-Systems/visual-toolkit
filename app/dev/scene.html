<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style></head>
<body><script type="module">
import * as THREE from "three/webgpu";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
import { ao } from "three/examples/jsm/tsl/display/GTAONode.js";
import { bloom } from "three/examples/jsm/tsl/display/BloomNode.js";
import { builtinAOContext, emissive, mrt, normalView, output, pass, screenUV, fract, positionWorld, smoothstep, mix, color } from "three/tsl";
import { getGenerator, spatialGlb, defaultParams, readGlbJson } from "../../lib/index.ts";
const q = new URLSearchParams(location.search);
const env = q.get("env") || "plant";
const night = env === "night";
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = night ? 1.1 : 1.05;
document.body.append(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene();
const bg = new THREE.Color(night ? "#060a0f" : "#2f3336");
scene.background = bg; scene.fog = new THREE.Fog(bg, 7, 18);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = night ? 0.3 : 0.5;
scene.add(new THREE.HemisphereLight(night ? 0x7fa6c8 : 0xf3ead8, night ? 0x05080b : 0x3a3a38, night ? 0.3 : 0.5));
const key = new THREE.DirectionalLight(night ? 0xcfe1ff : 0xffe2b8, night ? 1.6 : 3.0);
key.position.set(3, 5, 4); key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.1, far: 20 });
scene.add(key);
const rim = new THREE.DirectionalLight(night ? 0x5bd7fb : 0xbcd4ff, night ? 2.8 : 1.3); rim.position.set(-4, 2.5, -3); scene.add(rim);
const floorMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.85 });
const g = fract(positionWorld.xz.mul(2)).sub(0.5).abs();
const lm = smoothstep(0.465, 0.5, g.x.max(g.y));
floorMat.colorNode = night ? mix(color("#0e141b"), color("#1d4e5a"), lm) : mix(color("#8b8f91"), color("#6b6f71"), lm);
if (night) floorMat.emissiveNode = color("#1c8a9e").mul(lm.mul(0.12));
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 96), floorMat); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// Safety walkway stripes for plant realism.
if (!night) for (const z of [-1.55, 1.9]) { const s = new THREE.Mesh(new THREE.PlaneGeometry(12, 0.08), new THREE.MeshStandardNodeMaterial({ color: "#d5a01c", roughness: 0.7 })); s.rotation.x = -Math.PI / 2; s.position.set(0.5, 0.002, z); s.receiveShadow = true; scene.add(s); }
const items = JSON.parse(q.get("items"));
const loader = new GLTFLoader();
const mixers = [];
for (const it of items) {
  const gen = getGenerator(it.gen);
  const p = { ...defaultParams(gen.params), ...(it.p || {}) };
  const glb = spatialGlb(gen.generate(p), gen.spatial(p), { style: "modern-flat", theme: "light", state: it.state || "running", paint: it.paint || "slate" });
  const gltf = await loader.parseAsync(glb.slice().buffer, "");
  gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; if (o.userData?.vt?.internal) o.visible = false; } });
  for (const l of readGlbJson(glb).extras.vt.levels || []) { const n = gltf.scene.getObjectByName(l.node); if (n) n.scale.y = l.value; }
  gltf.scene.position.set(...it.at); gltf.scene.rotation.y = it.rot || 0; scene.add(gltf.scene);
  const mixer = new THREE.AnimationMixer(gltf.scene); for (const c of gltf.animations) mixer.clipAction(c).play(); mixer.update((it.t || 0.37)); mixers.push(mixer);
}
const cam = JSON.parse(q.get("cam") || '{"pos":[4.6,3.1,6.2],"target":[0.4,0.55,0],"fov":30}');
const camera = new THREE.PerspectiveCamera(cam.fov, innerWidth / innerHeight, 0.05, 80); camera.position.set(...cam.pos); camera.lookAt(...cam.target);
const prePass = pass(scene, camera, { samples: 0 }); prePass.setMRT(mrt({ output: normalView }));
const aoPass = ao(prePass.getTextureNode("depth"), prePass.getTextureNode(), camera); aoPass.samples.value = 24;
const scenePass = pass(scene, camera, { samples: 4 }); scenePass.setMRT(mrt({ output, emissive }));
scenePass.contextNode = builtinAOContext(aoPass.getTextureNode().sample(screenUV).r);
const pipeline = new THREE.RenderPipeline(renderer);
pipeline.outputNode = scenePass.getTextureNode("output").add(bloom(scenePass.getTextureNode("emissive"), 1.2, 0.6, 0));
renderer.setAnimationLoop(() => pipeline.render());
window.__ready = true;
</script></body></html>
